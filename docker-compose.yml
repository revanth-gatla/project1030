services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medlens-backend
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./medlens.db
      - BACKEND_PORT=8001
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - AI_PROVIDER=gemini
      - AI_MODEL=gemini-3.6-flash
    volumes:
      - ./backend/medlens.db:/app/medlens.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medlens-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
